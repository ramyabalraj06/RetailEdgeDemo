spring.application.name=retailedge
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.web.resources.static-locations=classpath:/static/
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/retailedge}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} requestId=%X{requestId} %msg %kvp%n
security.jwt.issuer-uri=${JWT_ISSUER_URI}
security.jwt.jwks-uri=${JWT_JWKS_URI}
security.jwt.audience=${JWT_AUDIENCE}
